const ctx = canvas.getContext('2d');

document.querySelectorAll('.preview-toggle button').forEach(btn => {

    btn.classList.add('active');
    if (btn.dataset.view === 'circle') {
      canvas.classList.add('circle');
    } else {
      canvas.classList.remove('circle');
    }
  };
});

const state = {
  size: 640,
  bgColor: '#06C755',
  transparent: false,
  mode: 'text',
  text: '紀澄',
  textColor: '#FFFFFF',
  emoji: '🍊',

  bothTextColor: '#FFFFFF',

  logoOffsetY: 0,

const EMOJIS = ['🍊','😀','😎','🥰','😺','🐶','🐱','🦊','🐻','🐼','🐨','🦁','🌸','🌺','🌻','🌈','⭐','✨','💫','🌙','☀️','🔥','💎','🎨','🎵','🎮','📚','☕','🍀','🌴','🎀','💖','💚','💙','💛','🧡','🍉','🍎','🍋','🥑'];

const picker = document.getElementById('emojiPicker');
EMOJIS.forEach(e => {
  const b = document.createElement('button');
  b.className = 'emoji-btn';
  b.textContent = e;

    document.getElementById('emojiInput').value = e;
    document.querySelectorAll('.emoji-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    draw();
  };
  picker.appendChild(b);
});

function drawAutoFitText(ctx, text, s, color) {
  const fontFamily = '-apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif';
  const cx = s / 2;
  const cy = s / 2;
  const safeRadius = s * 0.44;

  let lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length === 0) return;

  const candidates = [lines];
  if (lines.length === 1) {
    const line = lines[0];
    const len = line.length;
    if (len >= 4) {
      for (let breakPoints = 1; breakPoints <= 2 && breakPoints < len; breakPoints++) {
        const partSize = Math.ceil(len / (breakPoints + 1));
        const split = [];
        for (let i = 0; i < len; i += partSize) {
          split.push(line.slice(i, i + partSize));
        }
        if (split.length > 1) candidates.push(split);
      }
    }
  }

  let best = { size: 0, lines: lines };
  for (const candidateLines of candidates) {
    const size = findMaxFontSize(ctx, candidateLines, safeRadius, fontFamily);
    if (size > best.size) {
      best = { size, lines: candidateLines };
    }
  }

  const fontSize = best.size;
  const finalLines = best.lines;
  const lineHeight = fontSize * 1.15;

  ctx.font = `900 ${fontSize}px ${fontFamily}`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const totalHeight = lineHeight * finalLines.length;
  const startY = cy - totalHeight / 2 + lineHeight / 2;

  finalLines.forEach((line, i) => {
    ctx.fillText(line, cx, startY + i * lineHeight);
  });
}

function drawAutoFitLogoText(ctx, img, text, s, textColor) {
  const textFont = '-apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif';
  const cx = s / 2;
  const cy = s / 2;
  const safeRadius = s * 0.44;
  const hasText = text && text.trim();

  if (!img && !hasText) return;
  if (!img && hasText) { drawAutoFitText(ctx, text, s, textColor); return; }
  if (img && !hasText) {
    const d = s * 0.7;
    const r = img.width / img.height;
    const w = r >= 1 ? d : d * r;
    const h = r >= 1 ? d / r : d;
    ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
    return;
  }

  const baseText = s * 0.14;
  const baseLogo = s * 0.6;
  const gap = s * 0.025;
  const imgRatio = img.width / img.height;

  let lo = 0.1, hi = 2.0;
  for (let iter = 0; iter < 40; iter++) {
    const scale = (lo + hi) / 2;
    const tSize = baseText * scale;
    const lSize = baseLogo * scale;
    const lW = imgRatio >= 1 ? lSize : lSize * imgRatio;
    const lH = imgRatio >= 1 ? lSize / imgRatio : lSize;

    ctx.font = `900 ${tSize}px ${textFont}`;
    const tWidth = ctx.measureText(text).width;

    const totalH = lH + tSize + gap;
    const lCenterY = -totalH / 2 + lH / 2;
    const tCenterY = totalH / 2 - tSize / 2;
    const lMaxY = Math.max(Math.abs(lCenterY - lH / 2), Math.abs(lCenterY + lH / 2));
    const tMaxY = Math.max(Math.abs(tCenterY - tSize / 2), Math.abs(tCenterY + tSize / 2));

    let fits = true;
    if (lMaxY >= safeRadius || tMaxY >= safeRadius) fits = false;
    else {
      const lChord = Math.sqrt(safeRadius * safeRadius - lMaxY * lMaxY);
      const tChord = Math.sqrt(safeRadius * safeRadius - tMaxY * tMaxY);
      if (lW / 2 > lChord || tWidth / 2 > tChord) fits = false;
    }

    if (fits) lo = scale;
    else hi = scale;
  }

  const scale = lo;
  const tSize = baseText * scale;
  const lSize = baseLogo * scale;
  const lW = imgRatio >= 1 ? lSize : lSize * imgRatio;
  const lH = imgRatio >= 1 ? lSize / imgRatio : lSize;
  const totalH = lH + tSize + gap;
  const lCenterY = cy - totalH / 2 + lH / 2;
  const tCenterY = cy + totalH / 2 - tSize / 2;

  ctx.drawImage(img, cx - lW / 2, lCenterY - lH / 2, lW, lH);
  ctx.font = `900 ${tSize}px ${textFont}`;
  ctx.fillStyle = textColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, tCenterY);
}

function drawAutoFitBoth(ctx, emoji, text, s, textColor) {
  const textFont = '-apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif';
  const emojiFont = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
  const cx = s / 2;
  const cy = s / 2;
  const safeRadius = s * 0.44;
  const hasEmoji = emoji && emoji.trim();
  const hasText = text && text.trim();

  if (!hasEmoji && !hasText) return;
  if (hasEmoji && !hasText) {
    ctx.font = `${s * 0.56}px ${emojiFont}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, cx, cy);
    return;
  }
  if (!hasEmoji && hasText) {
    drawAutoFitText(ctx, text, s, textColor);
    return;
  }

  let lo = 0.1, hi = 2.0;
  const baseTextSize = s * 0.18;
  const baseEmojiSize = s * 0.28;
  const gap = s * 0.02;

  for (let iter = 0; iter < 40; iter++) {
    const scale = (lo + hi) / 2;
    const tSize = baseTextSize * scale;
    const eSize = baseEmojiSize * scale;

    ctx.font = `900 ${tSize}px ${textFont}`;
    const tWidth = ctx.measureText(text).width;
    ctx.font = `${eSize}px ${emojiFont}`;
    const eWidth = ctx.measureText(emoji).width;

    const totalHeight = eSize + tSize + gap;
    const eCenterY = -totalHeight / 2 + eSize / 2;
    const tCenterY = totalHeight / 2 - tSize / 2;

    const eTopY = Math.abs(eCenterY) + eSize / 2;
    const tBotY = Math.abs(tCenterY) + tSize / 2;

    let fits = true;
    if (eTopY >= safeRadius || tBotY >= safeRadius) {
      fits = false;
    } else {
      const eChord = Math.sqrt(safeRadius * safeRadius - eTopY * eTopY);
      const tChord = Math.sqrt(safeRadius * safeRadius - tBotY * tBotY);
      if (eWidth / 2 > eChord || tWidth / 2 > tChord) fits = false;
    }

    if (fits) lo = scale;
    else hi = scale;
  }

  const scale = lo;
  const tSize = baseTextSize * scale;
  const eSize = baseEmojiSize * scale;
  const totalHeight = eSize + tSize + gap;
  const eCenterY = cy - totalHeight / 2 + eSize / 2;
  const tCenterY = cy + totalHeight / 2 - tSize / 2;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `${eSize}px ${emojiFont}`;
  ctx.fillText(emoji, cx, eCenterY);
  ctx.font = `900 ${tSize}px ${textFont}`;
  ctx.fillStyle = textColor;
  ctx.fillText(text, cx, tCenterY);
}

function findMaxFontSize(ctx, lines, radius, fontFamily) {
  let lo = 10, hi = radius * 2;
  while (hi - lo > 1) {
    const mid = (lo + hi) / 2;
    ctx.font = `900 ${mid}px ${fontFamily}`;
    const lineHeight = mid * 1.15;
    const totalHeight = lineHeight * lines.length;
    let fits = true;

    if (totalHeight > radius * 2) {
      fits = false;
    } else {
      for (let i = 0; i < lines.length; i++) {
        const yCenter = -totalHeight / 2 + lineHeight / 2 + i * lineHeight;
        const topY = Math.abs(yCenter) + lineHeight / 2;
        if (topY >= radius) { fits = false; break; }
        const chordHalfWidth = Math.sqrt(radius * radius - topY * topY);
        const textWidth = ctx.measureText(lines[i]).width;
        if (textWidth / 2 > chordHalfWidth) { fits = false; break; }
      }
    }

    if (fits) lo = mid;
    else hi = mid;
  }
  return lo;
}

function draw() {
  const s = state.size;
  canvas.width = s;
  canvas.height = s;

  ctx.clearRect(0, 0, s, s);
  if (!state.transparent) {
    ctx.fillStyle = state.bgColor;
    ctx.fillRect(0, 0, s, s);
  }

  const cx = s / 2;
  const cy = s / 2;

  if (state.mode === 'text' && state.text.trim()) {
    drawAutoFitText(ctx, state.text, s, state.textColor);
  } else if (state.mode === 'emoji' && state.emoji) {
    const fontSize = state.emojiSize * (s / 640);
    ctx.font = `${fontSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(state.emoji, cx, cy);
  } else if (state.mode === 'logo' && state.logoImage) {
    const img = state.logoImage;
    const safeDiameter = s * (state.logoSize / 100);
    const ratio = img.width / img.height;
    let drawW, drawH;
    if (ratio >= 1) {
      drawW = safeDiameter;
      drawH = safeDiameter / ratio;
    } else {
      drawH = safeDiameter;
      drawW = safeDiameter * ratio;
    }
    const offsetY = state.logoOffsetY * (s / 100);
    ctx.drawImage(img, cx - drawW / 2, cy - drawH / 2 + offsetY, drawW, drawH);
  } else if (state.mode === 'both') {
    drawAutoFitBoth(ctx, state.bothEmoji, state.bothText, s, state.bothTextColor);
  } else if (state.mode === 'logotext') {
    drawAutoFitLogoText(ctx, state.logoImage, state.logoTextText, s, state.logoTextColor);
  }

}

    chip.classList.add('active');

const bgColor = document.getElementById('bgColor');

bgColor.oninput = () => {
  state.transparent = false;
  state.bgColor = bgColor.value.toUpperCase();
  bgHex.value = state.bgColor;
  draw();
};
bgHex.oninput = () => {
  let v = bgHex.value.trim();
  if (!v.startsWith('#')) v = '#' + v;
  if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
    state.transparent = false;
    state.bgColor = v.toUpperCase();
    bgColor.value = v;
    draw();

};

function setTransparent(flag) {
  state.transparent = flag;
  if (flag) {
    colorRow.classList.add('disabled');
  } else {
    colorRow.classList.remove('disabled');
  }
  draw();
}

document.querySelectorAll('.preset-color').forEach(p => {
  p.onclick = () => {

    if (c === 'transparent') {
      setTransparent(true);
      return;
    }
    setTransparent(false);
    state.bgColor = c;
    bgColor.value = c;
    bgHex.value = c;
    draw();

});

    tab.classList.add('active');

    state.mode = tab.dataset.tab;

const uploadBoxes = [
  { box: document.getElementById('uploadBox'), input: document.getElementById('logoFile'), clear: document.getElementById('clearLogoBtn') },
  { box: document.getElementById('uploadBox2'), input: document.getElementById('logoFile2'), clear: document.getElementById('clearLogoBtn2') }
];

function syncUploadBoxes(fileName) {
  uploadBoxes.forEach(({ box, clear }) => {
    const existing = box.querySelector('.upload-filename');
    if (existing) existing.remove();
    if (fileName) {
      box.classList.add('has-file');
      const nameEl = document.createElement('div');
      nameEl.className = 'upload-filename';
      nameEl.textContent = '✓ ' + fileName;
      box.appendChild(nameEl);
      clear.style.display = 'block';
    } else {
      box.classList.remove('has-file');
      clear.style.display = 'none';
    }
  });
}

function loadLogoFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    alert('請選擇圖片檔案（PNG / JPG / SVG）');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      state.logoImage = img;
      syncUploadBoxes(file.name);
      draw();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

uploadBoxes.forEach(({ box, input, clear }) => {
  input.onchange = (e) => loadLogoFile(e.target.files[0]);
  box.ondragover = (e) => { e.preventDefault(); box.classList.add('dragging'); };
  box.ondragleave = () => box.classList.remove('dragging');
  box.ondrop = (e) => {
    e.preventDefault();
    box.classList.remove('dragging');
    loadLogoFile(e.dataTransfer.files[0]);
  };
  clear.onclick = (ev) => {
    ev.preventDefault();
    state.logoImage = null;
    uploadBoxes.forEach(u => { u.input.value = ''; });
    syncUploadBoxes(null);
    draw();
  };
});

const API_BASE = 'https://line-avatar-api.zeabur.app';
const DOWNLOAD_KEY = 'line_avatar_download_count';
const downloadBadge = document.getElementById('downloadBadge');
const downloadCountEl = document.getElementById('downloadCount');

function formatCount(n) {
  return Number(n).toLocaleString('zh-TW');
}

function setBadge(n) {
  downloadCountEl.textContent = formatCount(n);
}

function popBadge() {
  downloadBadge.classList.remove('pop');
  void downloadBadge.offsetWidth;
  downloadBadge.classList.add('pop');
}

async function fetchGlobalCount() {
  try {
    const res = await fetch(API_BASE + '/count', { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    setBadge(data.count);
    localStorage.setItem(DOWNLOAD_KEY, String(data.count));
  } catch (e) {
    const cached = parseInt(localStorage.getItem(DOWNLOAD_KEY) || '0', 10);
    setBadge(cached);
  }
}

async function bumpGlobalCount() {
  try {
    const res = await fetch(API_BASE + '/count', { method: 'POST' });
    if (!res.ok) throw new Error('bump failed');
    const data = await res.json();
    setBadge(data.count);
    localStorage.setItem(DOWNLOAD_KEY, String(data.count));
    popBadge();
  } catch (e) {
    const cached = parseInt(localStorage.getItem(DOWNLOAD_KEY) || '0', 10) + 1;
    localStorage.setItem(DOWNLOAD_KEY, String(cached));
    setBadge(cached);
    popBadge();
  }
}

fetchGlobalCount();

document.getElementById('downloadBtn').onclick = () => {
  const link = document.createElement('a');
  link.download = `LINE頭照_${state.size}x${state.size}_${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  bumpGlobalCount();
};

document.getElementById('resetBtn').onclick = () => {
  const saved = localStorage.getItem(DOWNLOAD_KEY);
  location.reload();
  if (saved !== null) localStorage.setItem(DOWNLOAD_KEY, saved);
};

draw();
